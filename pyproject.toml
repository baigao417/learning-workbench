[project]
name = "learning-workbench"
version = "0.1.0"
description = "Local-first all-in-one learning workbench"
requires-python = ">=3.11"
dependencies = ["opencc-python-reimplemented>=0.1.7"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1.0"]

[project.scripts]
learning-workbench = "learning_workbench.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
