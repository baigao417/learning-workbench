name: Workbench checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python and browser helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install pytest opencc-python-reimplemented
      - name: Python integration and unit tests
        run: python -m pytest -q
      - name: Browser helper tests
        run: node --test tests/*.test.js
      - name: JavaScript syntax
        run: |
          for file in web/*.js; do node --check "$file"; done
      - name: Whitespace
        run: git diff --check
